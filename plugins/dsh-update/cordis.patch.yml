# dsh-update bundle layer: one dual-face row. The host Loader imports the
# package main (node half: read-only /updater/* routes), and client-modules
# picks up the dsh.client declaration for the browser half (settings row +
# new-version toast via the optional notifier service).
# remote/branch: which remote ref the update check compares against.
- insert:
    - id: dsh-update
      name: dsh-update
      config:
        remote: origin
        branch: master
