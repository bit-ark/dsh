# dsh-deepseek-balance bundle layer: inserts the dsh-deepseek-balance plugin row.
# Applied when a profile lists this bundle (dsh plugin --profile <name> add).
# All config keys are optional; defaults shown inline.
- insert:
    - id: dsh-deepseek-balance
      name: dsh-deepseek-balance
      # config:
      #   apiKeyEnv: DEEPSEEK_API_KEY        # 每次请求解析的凭据引用（环境变量名）
      #   balanceBaseURL: https://api.deepseek.com
      #   usageDays: 14                       # 默认图表窗口（1..90）
      #   cacheTtlMs: 300000                  # 用量聚合缓存（毫秒）
      #   costCurrency: CNY                   # 费用显示币种（CNY → ¥，USD → $）
      #   peakHours: [9,10,11,12,13]          # 高峰时段（北京小时，单价 ×2）
      #   # 模型单价（元/百万 tokens，空闲基准），合并覆盖内置默认价
      #   #（flash: 0.05/1.5/4.5，pro: 0.15/4.5/13.5）；未配置价格的模型不计费。
      #   pricesPerM:
      #     deepseek-v4-flash: { inputMiss: 1.5, inputHit: 0.05, output: 4.5 }
      #     deepseek-v4-pro: { inputMiss: 4.5, inputHit: 0.15, output: 13.5 }
      #   # provider 路由 → API key 名称（凭据引用）显式映射，覆盖自动探测；
      #   # 缺省自动读取 llm-deepseek / llm-pi-ai 设置命名空间推导。
      #   keyNameByProvider:
      #     deepseek-official: DEEPSEEK_API_KEY
      #     qwen-token-plan-cn: QWEN_TOKEN_PLAN_CN_API_KEY
